<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1>Mit Pokédex</h1>
        <nav>
            <a href="pokemon.html">Pokémon</a>
            <a href="trainers.html">Trainers</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>
    </header>

    <main>
        <h2>Dashboard</h2>
        <section class="stats">
            <div class="stat-box"><h3>Antal Pokémon</h3><p id="pokemonCount">Henter...</p></div>
            <div class="stat-box"><h3>Antal trainers</h3><p id="trainerCount">Henter...</p></div>
            <div class="stat-box"><h3>Pokémon tildelt til trainers</h3><p id="assignedPokemonCount">Henter...</p></div>
        </section>

        <h3>Pokémon fordelt på primær type</h3>
        <div class="chart-box"><canvas id="pokemonTypeChart"></canvas></div>

        <h3>Gennemsnitlig attack efter primær type</h3>
        <div class="chart-box"><canvas id="pokemonAttackChart"></canvas></div>
    </main>

    <script src="js/dashboard.js"></script>
</body>
</html>
